# Repo-local lazygit theme — orange to match Hub & Spoke.
# Activate by setting LG_CONFIG_FILE=$PWD/.lazygit.yml before running
# lazygit (the shell-function hookup at the bottom of this file makes
# that automatic when cwd is inside this repo).
gui:
  theme:
    activeBorderColor: ["#f97316", bold]      # orange-500 — selected pane border
    inactiveBorderColor: ["#52525b"]          # neutral-600 — quiet borders
    selectedLineBgColor: ["#7c2d12"]          # orange-900 — current row highlight
    selectedRangeBgColor: ["#9a3412"]         # orange-800 — multi-select bg
    optionsTextColor: ["#fb923c"]             # orange-400 — bottom bar shortcut keys
    cherryPickedCommitBgColor: ["#fb923c"]
    cherryPickedCommitFgColor: ["#1c1917"]
    markedBaseCommitBgColor: ["#f97316"]
    markedBaseCommitFgColor: ["#1c1917"]
    unstagedChangesColor: ["#dc2626"]         # red-600 — keep destructive things obviously red
    defaultFgColor: ["default"]
  authorColors:
    "Pat Walls": "#f97316"

