# Grouped so each week is one PR per ecosystem, not dozens. Minor/patch groups
# auto-merge once CI's `build` check passes (dependabot-auto-merge.yml); majors
# arrive as their own PRs and wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    open-pull-requests-limit: 5
    # Auto-merge plus a fresh release is the supply-chain-attack path: wait a
    # week so a hijacked publish is usually yanked before we ever see it.
    # (Security updates ignore cooldown and still arrive immediately.)
    cooldown:
      default-days: 7
    ignore:
      # The job runtime. 0.16.6 → 0.18.0 auto-merged on 2026-10-12 (minor
      # group) and changed lock semantics under us; three wedged queues
      # followed on 2026-10-15. Patches still flow; minors/majors are a
      # deliberate upgrade with the release notes read and a worktree test.
      - dependency-name: graphile-worker
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      actions:
        update-types: [minor, patch]
