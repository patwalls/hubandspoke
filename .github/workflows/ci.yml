# The `build` job is the required status check on `main` (repository ruleset
# "main: require build"). Renaming the job renames the check — update the
# ruleset in the same change or every PR blocks forever. See docs/conventions.md
# → CI & Dependabot.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      # Unit project only: integration tests need a seeded Postgres (factories
      # borrow an existing admin user + starter-story X account). Lint is not
      # gated yet — main carries pre-existing eslint errors.
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
