# Arms GitHub auto-merge on grouped Dependabot minor/patch PRs. The merge only
# happens once the required `build` check (ci.yml) passes; a red build leaves
# the PR open for a human. Majors and ungrouped PRs are never auto-merged.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'patwalls/hubandspoke'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: steps.meta.outputs.dependency-group != '' && steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
